<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--ac);color:#fff;padding:18px 16px 0}
header h1{margin:0;font-size:1.35rem;font-weight:800}
header p{margin:2px 0 12px;opacity:.9;font-size:.9rem}
nav{display:flex;gap:4px;max-width:900px;margin:0 auto}
nav button{flex:1;border:0;background:rgba(255,255,255,.18);color:#fff;font:600 .95rem inherit;font-family:inherit;padding:10px 6px;border-radius:10px 10px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--ink)}
header>div{max-width:900px;margin:0 auto}
main{max-width:900px;margin:0 auto;padding:16px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.w{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.row{display:flex;align-items:center;gap:8px}
.word{font-size:1.25rem;font-weight:800;flex:1}
.ty{color:var(--mut);font-size:.85rem;font-style:italic}
.sp{border:0;background:var(--acs);color:var(--ac);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:1rem;flex:none}
.sp:active{background:var(--hi)}
.vi{font-weight:600;margin:4px 0;cursor:pointer}
.vi.hide{background:var(--ln);color:transparent;border-radius:6px;user-select:none}
.ex{display:flex;gap:8px;align-items:center;color:var(--mut);font-size:.92rem}
.ex span{flex:1}
.note{margin-top:6px;font-size:.88rem;border-left:3px solid var(--hi);padding-left:8px}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
summary{padding:13px 14px;font-weight:800;cursor:pointer}
details>div{padding:0 14px 12px}
details li{margin:4px 0}
.q{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
.q h2{font-size:1.1rem;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{background:var(--oks);border-color:var(--ok)}
.opt.no{background:var(--bads);border-color:var(--bad)}

.go{border:0;background:var(--ac);color:#fff;padding:11px 20px;border-radius:10px;font:600 1rem inherit;font-family:inherit;cursor:pointer;margin-top:12px}
.bar{height:8px;background:var(--ln);border-radius:9px;margin-bottom:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.modes button{padding:18px;text-align:left;border:1.5px solid var(--ln);background:var(--card);color:var(--ink);border-radius:14px;font:inherit;cursor:pointer}
.modes b{display:block;font-size:1.1rem}

.rib{background:#2a9d8f;color:#fff;font-weight:800;text-align:center;padding:6px 18px;border-radius:6px;width:max-content;max-width:100%;margin:0 auto 12px}.bx{background:#d6f0f3;color:#14213d;border-radius:14px;padding:8px 14px;margin-bottom:12px}.bx p{margin:6px 0}
.hd{background:#c8ecd6;color:#1f8a4c;font-weight:800;text-align:center;padding:6px;border-radius:6px 6px 0 0}.tb{display:grid;grid-template-columns:1.25fr 1fr;border-radius:0 0 8px 8px;overflow:hidden;margin-bottom:12px}.tl{background:#fde3e3;padding:10px 12px;border-bottom:2px solid #fff}.tr{background:#e8eaef;padding:10px 12px;border-bottom:2px solid #fff;color:#7a2a8a}.r{color:#d6336c}
.pf{display:flex;align-items:center;gap:6px;margin:3px 0}.pf span{color:#7a3e9d}.u{display:grid;grid-template-columns:1fr 2fr;gap:8px 10px;margin-bottom:12px}.ul{background:#a9d98a;border-radius:10px;padding:8px;text-align:center}.ur{background:#eaf5e0;border-radius:10px;padding:8px}.wl{border:0;background:none;color:inherit;font:inherit;font-style:italic;cursor:pointer;padding:0 2px;text-decoration:underline dotted}.cp{border-radius:12px;padding:10px 14px;margin:8px 0;display:flex;flex-direction:column;gap:4px}.tip{border-left:4px solid #f08a24;background:#fff4e5;padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px}
@media (max-width:560px){.tb,.u{grid-template-columns:1fr}}.m{color:var(--mut);font-size:.9rem}.rl{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--ln)}.rl b{flex:1}.fix{color:var(--ok);font-weight:600;margin-left:4px}.item{margin:6px 0;line-height:2.1}.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 16px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

var G=[
{t:"Lesson 1. Nouns (Danh từ)",r:"<ul><li>Danh từ đếm được số nhiều: thêm <b>-s</b> (pen → pens); tận cùng <b>-ch, -sh, -x, -s, -ss</b> thêm <b>-es</b> (box → boxes).</li><li>Phụ âm + y → <b>-ies</b> (baby → babies); nguyên âm + y thêm <b>-s</b> (boy → boys).</li><li>-f/-fe → <b>-ves</b> (life → lives); -o thường thêm <b>-es</b> (potato → potatoes).</li><li>Bất quy tắc: man → men, child → children, foot → feet, tooth → teeth, person → people.</li><li>Không đếm được (milk, bread, money, furniture, homework, weather): không thêm s, dùng <b>much</b>.</li></ul>",e:["Two boxes are on the table.","Three children are playing."]},
{t:"Lesson 2. Pronouns (Đại từ)",r:"<ul><li>Chủ ngữ: I, you, he, she, it, we, they. Tân ngữ: me, you, him, her, it, us, them.</li><li>Tính từ sở hữu + danh từ: my, your, his, her, its, our, their.</li><li>Đại từ sở hữu đứng một mình: mine, yours, his, hers, ours, theirs.</li><li>Phản thân: myself, himself, herself, themselves.</li></ul>",e:["Can you help me?","That book is mine, not hers."]},
{t:"Lesson 3. Articles và Quantifiers",r:"<ul><li><b>a</b> trước âm phụ âm (a book); <b>an</b> trước âm nguyên âm (an apple, an hour); <b>the</b> khi đã xác định.</li><li><b>some</b> dùng trong câu khẳng định, <b>any</b> trong câu phủ định và câu hỏi.</li><li><b>many</b> + đếm được số nhiều, <b>much</b> + không đếm được; <b>a lot of</b> dùng cho cả hai.</li><li><b>a few</b> + đếm được (một vài), <b>a little</b> + không đếm được (một chút).</li></ul>",e:["She is an honest girl.","We don’t have any homework."]},
{t:"Lesson 4. Adjectives và Adverbs",r:"<ul><li>Tính từ bổ nghĩa danh từ, đứng trước danh từ hoặc sau be: a careful driver, he is careful.</li><li>Trạng từ bổ nghĩa động từ: thường là tính từ + <b>-ly</b> (slow → slowly).</li><li>Bất quy tắc: good → <b>well</b>. fast, hard, late giữ nguyên dạng.</li></ul>",e:["He drives carefully.","She speaks English well."]},
{t:"Lesson 5. Comparisons (So sánh)",r:"<ul><li>Tính từ ngắn: <b>-er than</b> (taller than), <b>the -est</b> (the tallest). Phụ âm + y → ier (heavy → heavier).</li><li>Tính từ dài: <b>more … than</b>, <b>the most …</b> (more difficult, the most beautiful).</li><li>Bất quy tắc: good → better → best; bad → worse → worst.</li><li>Ngang bằng: <b>as … as</b>.</li></ul>",e:["My bag is heavier than yours.","This is the best film."]},
{t:"Lesson 6. Modal Verbs",r:"<ul><li>Modal + <b>động từ nguyên mẫu</b>, không thêm s hay to: She can play the piano.</li><li><b>can/could</b>: khả năng, xin phép. <b>must</b>: bắt buộc. <b>should</b>: lời khuyên. <b>may</b>: có thể xảy ra, xin phép lịch sự.</li><li>Phủ định: cannot (can’t), must not (mustn’t: cấm), should not (shouldn’t).</li></ul>",e:["You must be quiet here.","Could you open the window?"]},
{t:"Lesson 7. Prepositions (Giới từ)",r:"<ul><li>Thời gian: <b>at</b> + giờ (at 7 o’clock); <b>on</b> + thứ/ngày (on Monday, on 5 May); <b>in</b> + tháng/năm/mùa (in July, in 2026, in summer).</li><li>Nơi chốn: <b>at</b> + điểm (at school), <b>on</b> + bề mặt (on the table), <b>in</b> + không gian (in the room).</li><li>Khác: to (đến), from (từ), with (cùng), by (bằng phương tiện: by bus).</li></ul>",e:["The class starts at 7 o’clock.","My birthday is in July."]},
{t:"Lesson 8. Verb Forms",r:"<ul><li><b>V-ing</b> sau enjoy, like, love, hate, finish, stop: I enjoy listening to music.</li><li><b>to + V</b> sau want, would like, hope, decide, need: She wants to be a doctor.</li><li>Động từ nguyên mẫu sau modal, let, make.</li><li>Quá khứ phân từ (V3) dùng với have và bị động: done, seen, gone.</li></ul>",e:["I enjoy listening to music.","She wants to be a doctor."]},
{t:"Lesson 9. Tenses (Các thì)",r:"<ul><li><b>Hiện tại đơn</b>: thói quen, sự thật; he/she/it + V-s: He goes to school every day.</li><li><b>Hiện tại tiếp diễn</b>: am/is/are + V-ing, việc đang xảy ra: Look! The baby is sleeping.</li><li><b>Quá khứ đơn</b>: V-ed hoặc bất quy tắc, có mốc quá khứ: We went to Da Nang last summer.</li><li><b>Hiện tại hoàn thành</b>: have/has + V3, với since, for, already, ever: I have lived here since 2020.</li><li><b>Tương lai</b>: will + V, be going to + V.</li></ul>",e:["He goes to school every day.","I have lived here since 2020."]}];

var IRR={men:'man',women:'woman',children:'child',feet:'foot',teeth:'tooth',mice:'mouse',people:'person',policemen:'policeman'},SAME=' news means species deer sheep fish salmon ',PLO=' glasses jeans scissors shorts trousers chopsticks sunglasses ',UNC=' bread meat cheese butter fruit food milk water wine beer coffee tea weather heat snow lightning wind rain thunder mathematics physics chemistry economics baseball chess golf tennis billiards beauty freedom love work time information knowledge furniture money luggage traffic business baggage homework housework sugar soup salt smoke rice sleep advice juice popcorn chicken ',COMP=' washing machine blackboard black board mother tongue bus stop housework sunrise traffic jam seafood bedroom classmate recycling bin bus driver flower pot flowerpot swimming pool life jacket hair dryer hairdryer alarm clock mobile phone toothbrush tooth brush headache ',SP={houses:'house tận cùng -e nên chỉ thêm -s: house → houses.',roses:'rose tận cùng -e nên chỉ thêm -s: rose → roses.',horses:'horse tận cùng -e nên chỉ thêm -s: horse → horses.',cheese:'Trong danh từ ghép cheese cake, từ đứng trước giữ nguyên, không thêm s: cheesecake.',advice:'advice không đếm được: không dùng a/an, không thêm s (some advice).',orange:'orange bổ nghĩa cho juice trong danh từ ghép orange juice nên giữ số ít.',sunglasses:'sunglasses (kính râm) luôn ở dạng số nhiều, đi với a pair of.','sun cream':'Danh từ ghép đúng thứ tự là sun cream (kem chống nắng).',chicken:'chicken (thịt gà) là danh từ không đếm được, không thêm s.',coins:'coin đếm được; đi với stamps nên dùng số nhiều coins.',hours:'five to six + danh từ số nhiều: hours.',sandwiches:'sandwich tận cùng -ch nên thêm -es.',key:'a key: sau a là danh từ số ít.',buffaloes:'buffalo tận cùng -o, thường thêm -es (buffalo cũng được).',c:'Danh từ đếm được: đếm được bằng số, có số nhiều.',u:'Danh từ không đếm được: không thêm s, không dùng a/an.'};
function why(w,n){if(n)return n;w=w.toLowerCase();if(SP[w])return SP[w];if(IRR[w])return 'Bất quy tắc: '+IRR[w]+' → '+w+' (cần học thuộc).';var q=' '+w+' ';if(SAME.indexOf(q)>-1)return w+' giữ nguyên dạng ở số ít và số nhiều.';if(PLO.indexOf(q)>-1)return w+' luôn ở dạng số nhiều (vật có 2 bộ phận), không bỏ s.';if(UNC.indexOf(q)>-1)return w+' là danh từ không đếm được: không thêm s, không dùng a/an; dùng much, some, a lot of.';if(COMP.indexOf(q)>-1)return 'Danh từ ghép: hai từ ghép thành một danh từ mới (xem phần Compound Nouns).';if(/[^aeiou]ies$/.test(w))return 'Phụ âm + y → bỏ y, thêm -ies: '+w.slice(0,-3)+'y → '+w+'.';if(/ves$/.test(w))return 'Tận cùng -f/-fe đổi thành -ves: '+w+'.';if(/oes$/.test(w))return 'Tận cùng -o thường thêm -es: '+w.slice(0,-2)+' → '+w+'.';if(/(ch|sh|x|s|ss)es$/.test(w))return 'Tận cùng -ch, -sh, -x, -s, -ss thêm -es: '+w.slice(0,-2)+' → '+w+'.';if(/[aeiou][yo]s$/.test(w))return 'Nguyên âm + y/o chỉ thêm -s: '+w.slice(0,-1)+' → '+w+'.';if(/s$/.test(w))return 'Danh từ số nhiều thường thêm -s: '+w.slice(0,-1)+' → '+w+'.';return 'Sau a/an hoặc chủ ngữ số ít, dùng danh từ số ít, không thêm s.'}
function nt(a){var o=[];a.split('|')[0].split(' ').forEach(function(w){if((IRR[w]||SAME.indexOf(' '+w+' ')>-1||(/^[a-z]{4,}s$/.test(w)&&w!='this'&&w!='always'))&&o.indexOf(why(w))<0)o.push(why(w))});return o.join(' ')+' Nếu có động từ is/has thì đổi: is → are, has → have.'}
